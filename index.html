<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Valentine 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 280px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      background: #ff4d6d;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Happy Valentine’s 💖</h1>
  <p>Are you ready for your love quiz?</p>
  <button onclick="startLove()">Start 💕</button>
</div>

<audio id="bg-music" loop>
  <source src="song.m4a" type="audio/mp4">
</audio>

<script>
function startLove() {
  localStorage.setItem("musicAllowed", "yes");
  document.getElementById("bg-music").play();
  window.location.href = "quiz.html";
}
</script>

</body>
</html>
