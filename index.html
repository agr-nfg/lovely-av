<!DOCTYPE html>
<html>
<head>
  <title>Boyfriend Test 💖</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #ff4d6d;
      color: white;
      font-size: 16px;
    }
    .tap {
      font-size: 12px;
      color: gray;
      margin-top: 10px;
    }
  </style>
</head>
<body onclick="startMusic()">

<audio id="music" loop>
  <source src="song.m4a" type="audio/mp4">
</audio>

<div class="box">
  <h2>Boyfriend Test 💘</h2>
  <p>When did we first talk?</p>

  <button onclick="correct()">2023</button><br>
  <button onclick="wrong()">2021</button><br>
  <button onclick="wrong()">2020</button>

  <p class="tap">Tap anywhere to start music 🎵</p>
</div>

<script>
let started = false;
let score = 0;

function startMusic() {
  if (!started) {
    const music = document.getElementById("music");
    music.play();
    localStorage.setItem("music", "on");
    started = true;
  }
}

function correct() {
  score += 100;
  localStorage.setItem("score", score);
  window.location.href = "result.html";
}

function wrong() {
  alert("Wrong 😤 try again!");
}
</script>

</body>
</html>
