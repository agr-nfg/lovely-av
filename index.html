<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Love Quiz 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 { margin-bottom: 10px; }
    .question { margin-top: 15px; text-align: left; }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #ff4d6d;
      color: white;
      font-size: 16px;
    }
    .tap {
      font-size: 12px;
      color: gray;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<audio id="music" src="song.m4a" loop></audio>

<div class="card" onclick="playMusic()">
  <div class="tap">Tap anywhere to start music 🎵</div>
  <h1>Our Love Quiz 💘</h1>

  <div class="question">
    1. What year did we talk first?
    <input id="q1">
  </div>

  <div class="question">
    2. Who said "I love you" first?
    <input id="q2">
  </div>

  <div class="question">
    3. Who kissed first?
    <input id="q3">
  </div>

  <div class="question">
    4. Where did we travel together first?
    <input id="q4">
  </div>

  <div class="question">
    5. How much do I love you?
    <input id="q5">
  </div>

  <button onclick="submitQuiz()">Submit 💌</button>
</div>

<script>
function playMusic() {
  document.getElementById("music").play();
}

function submitQuiz() {
  let score = 0;

  let a1 = q1.value.trim().toLowerCase();
  let a2 = q2.value.trim().toLowerCase();
  let a3 = q3.value.trim().toLowerCase();
  let a4 = q4.value.trim().toLowerCase();
  let a5 = q5.value.trim().toLowerCase();

  // Q1 – Year
  if (a1 == "2023" || a1 == "23") score++;

  // Q2 – I love you first
  if (a2 == "av" || a2 == "ava" || a2 == "you") score++;

  // Q3 – Kissed first
  if (a3 == "agr" || a3 == "you") score++;

  // Q4 – Travel
  if (a4.includes("kanya")) score++;

  // Q5 – Love amount
  if (a5 == "infinity" || a5 == "infinite" || a5 == "∞" || a5 == "endless") score++;

  localStorage.setItem("score", score);
  window.location.href = "result.html";
}

</script>

</body>
</html>
