<!DOCTYPE html>
<html>
<head>
  <title>Your Result 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 400px;
    }
  </style>
</head>
<body onclick="playMusic()">

<audio id="music" src="song.m4a" loop></audio>

<div class="box">
  <h1 id="scoreText"></h1>
  <p id="message"></p>
</div>

<script>
function playMusic() {
  document.getElementById("music").play();
}

let score = localStorage.getItem("score");

document.getElementById("scoreText").innerText = score + " / 5 💕";

let msg = "";
if (score == 5) {
  msg = "You are officially my soulmate 🥹💍";
} else if (score >= 3) {
  msg = "Good boyfriend, but needs more cuddles 🤭";
} else {
  msg = "Fake boyfriend detected 😤";
}

document.getElementById("message").innerText = msg;
</script>

</body>
</html>
