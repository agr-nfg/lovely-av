<!DOCTYPE html>
<html>

      border: none;
      border-radius: 10px;
      background: #ff4d6d;
      color: white;
      font-size: 15px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>10/10 🏆</h1>
  <p>You officially win my heart forever 💖</p>
  <p>
    I love you more than you’ll ever know.  
    Thank you for being my person ❤️
  </p>

  <button onclick="alert('Will you be my Valentine forever? 😌💍')">
    Click for surprise
  </button>
</div>

</body>
</html>
