<!DOCTYPE html>
<html>
<head>
  <title>Your Love Score 💕</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(to bottom right, #ff758c, #ff7eb3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Comic Sans MS', cursive;
      color: white;
      text-align: center;
    }

    .box {
      background: rgba(0,0,0,0.4);
      padding: 40px;
      border-radius: 30px;
      width: 90%;
      max-width: 600px;
    }

    h1 { font-size: 2.5em; }

    .gif {
      width: 200px;
      border-radius: 20px;
      margin: 15px;
    }

    .emoji {
      font-size: 40px;
    }
  </style>
</head>

<body onclick="playMusic()">

<audio id="bgm" loop>
  <source src="song.m4a" type="audio/mp4">
</audio>

<div class="box">
  <h1>💘 Your Love Score 💘</h1>
  <div class="emoji">💖 💕 💞 💝 💓</div>

  <h2 id="score"></h2>

  <p id="msg"></p>

  <img class="gif" src="https://media.giphy.com/media/l4FGpP4lxGGgK5CBW/giphy.gif">
  <img class="gif" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">
</div>

<script>
let played = false;
function playMusic(){
  if(!played){
    document.getElementById("bgm").play();
    played = true;
  }
}

let s = localStorage.getItem("score");
document.getElementById("score").innerText = `You scored ${s}/10 💯`;

let msg = "";
if(s >= 9) msg = "SOULMATES. PERIOD. 💍";
else if(s >= 7) msg = "Deeply in love 😘";
else msg = "Still cute though 😌";

document.getElementById("msg").innerText = msg;
</script>

</body>
</html>
